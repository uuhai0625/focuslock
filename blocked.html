<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>FocusLock - 集中タイム</title>
<style>
  :root {
    --bg: #1c1c1e;
    --text: #f2f2f2;
    --text-secondary: #b5b5b0;
    --pro: #9b7aeb;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { text-align: center; max-width: 420px; padding: 24px; }
  .lock { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
  .countdown { font-size: 32px; font-weight: 700; color: var(--pro); margin: 16px 0; }
  button {
    margin-top: 16px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1 id="heading" data-i18n="blockedHeading">Focus time</h1>
    <p id="message"></p>
    <div id="countdown" class="countdown hidden"></div>
    <button id="btn-back" data-i18n="backButton">Back</button>
  </div>

<script src="lib/countdown.js"></script>
<script src="lib/i18n.js"></script>
<script src="blocked.js"></script>
</body>
</html>
