<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>FocusLock</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>

<h1 class="sr-only" data-i18n="popupA11yTitle">FocusLock focus session controls</h1>

<div class="panel">
  <p class="title">FocusLock</p>

  <div id="session-idle" class="block">
    <p class="section-label" data-i18n="startSessionLabel">Start a focus session</p>
    <div class="session-buttons">
      <button class="session-btn" data-minutes="25" data-i18n="session25min">25 min</button>
      <button class="session-btn" data-minutes="50" data-i18n="session50min">50 min</button>
      <button class="session-btn" data-minutes="90" data-i18n="session90min">90 min</button>
    </div>
    <p id="pro-hint" class="muted small hidden" data-i18n="proRequiredHint">* Focus sessions are a paid feature</p>
  </div>

  <div id="session-active" class="block hidden">
    <p class="section-label" data-i18n="sessionActiveLabel">Focus session in progress</p>
    <p id="countdown" class="countdown">--:--</p>
    <button id="btn-end-early" class="secondary" data-i18n="endEarlyButton">End early</button>
    <div id="phrase-prompt" class="hidden">
      <input id="phrase-input" type="text" data-i18n-placeholder="phrasePromptPlaceholder" placeholder="Enter passphrase" />
      <button id="btn-confirm-end" data-i18n="confirmEndButton">End session</button>
      <p id="phrase-error" class="error hidden" data-i18n="phraseError">Wrong passphrase</p>
    </div>
  </div>

  <div class="block">
    <p class="section-label" data-i18n="blockNowLabel">Block now</p>
    <label class="toggle-row">
      <input type="checkbox" id="manual-toggle" />
      <span data-i18n="manualToggleLabel">Toggle manual blocking</span>
    </label>
  </div>

  <div class="block">
    <p class="section-label" data-i18n="blockListLabel">Blocked sites</p>
    <div class="add-row">
      <input id="site-input" type="text" data-i18n-placeholder="siteInputPlaceholder" placeholder="e.g. x.com" />
      <button id="btn-add-site" data-i18n="addButton">Add</button>
    </div>
    <ul id="site-list" class="site-list"></ul>
  </div>

  <div class="plan-row">
    <span id="plan-label" class="muted" data-i18n="planFree">Free</span>
  </div>
  <button id="btn-upgrade" class="upgrade hidden">
    <span class="icon">⭐</span><span data-i18n="upgradeButton">Unlock focus sessions (one-time purchase)</span>
  </button>
  <button id="btn-options" class="link-btn" data-i18n="optionsLink">Advanced settings (passphrase, schedule)</button>
</div>

<div id="toast" class="toast hidden"></div>

<script src="../lib/ExtPay.js"></script>
<script src="../lib/patterns.js"></script>
<script src="../lib/countdown.js"></script>
<script src="../lib/i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
